<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outfield Positioning Optimizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      padding: 32px 24px;
      border-right: 1px solid #e5e5e5;
      flex-shrink: 0;
    }

    .sidebar h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 32px;
      line-height: 1.3;
    }

    .field-group {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }

    .field-select {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23999' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
    }

    .field-select:focus {
      outline: none;
      border-color: #1a1a1a;
    }

    .btn-generate {
      width: 100%;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #1a1a1a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }

    .btn-generate:hover {
      opacity: 0.85;
    }

    .btn-generate:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-line {
      font-size: 12px;
      color: #888;
      margin-top: 12px;
    }

    .status-line.error {
      color: #d32f2f;
    }

    .status-line.success {
      color: #2e7d32;
    }

    /* Main content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .title-bar {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .spray-image {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      border-radius: 4px;
    }

    .empty-state {
      color: #bbb;
      font-size: 15px;
      text-align: center;
      line-height: 1.6;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e5e5e5;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [batters, setBatters] = useState({});
      const [selectedBatter, setSelectedBatter] = useState("");
      const [pitcherHand, setPitcherHand] = useState("RHP");
      const [imageBase64, setImageBase64] = useState(null);
      const [batterLabel, setBatterLabel] = useState("");
      const [loading, setLoading] = useState(false);
      const [loadingBatters, setLoadingBatters] = useState(true);
      const [error, setError] = useState(null);
      const [playerCount, setPlayerCount] = useState(0);

      // Load batters on mount
      useEffect(() => {
        fetch("/api/batters")
          .then((r) => r.json())
          .then((data) => {
            if (data.ok && data.batters) {
              setBatters(data.batters);
              const ids = Object.keys(data.batters);
              setPlayerCount(ids.length);
              if (ids.length > 0) {
                setSelectedBatter(ids[0]);
              }
            }
            setLoadingBatters(false);
          })
          .catch(() => setLoadingBatters(false));
      }, []);

      // Poll cache status to update player list with confirmed players
      useEffect(() => {
        let interval = null;
        let attempts = 0;

        const poll = () => {
          fetch("/api/cache-status")
            .then((r) => r.json())
            .then((data) => {
              if (data.batters && Object.keys(data.batters).length > 0) {
                setBatters(data.batters);
                setPlayerCount(Object.keys(data.batters).length);
              }
              if (data.ready) {
                clearInterval(interval);
              }
            })
            .catch(() => {
              attempts++;
              if (attempts > 5) clearInterval(interval);
            });
        };

        interval = setInterval(poll, 5000);
        return () => clearInterval(interval);
      }, []);

      const sortedBatterIds = Object.keys(batters).sort((a, b) => {
        const la = (batters[a].label || "").toLowerCase();
        const lb = (batters[b].label || "").toLowerCase();
        return la.localeCompare(lb);
      });

      const handleGenerate = () => {
        if (!selectedBatter) return;
        setLoading(true);
        setError(null);
        setImageBase64(null);

        const batter = batters[selectedBatter] || {};

        fetch("/api/compute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            batter_id: selectedBatter,
            pitcher_hand: pitcherHand,
            batter_name: batter.batter_name,
            batter_hand: batter.batter_hand,
          }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.ok) {
              setImageBase64(data.image_base64);
              setBatterLabel(data.batter_label || batter.label || "");
            } else {
              setError(data.error || "Failed to generate positions.");
            }
            setLoading(false);
          })
          .catch((err) => {
            setError("Network error — is the server running?");
            setLoading(false);
          });
      };

      return (
        <div className="app">
          <div className="sidebar">
            <h1>Outfield Positioning Optimizer</h1>

            <div className="field-group">
              <label className="field-label">Pitcher Handedness</label>
              <select
                className="field-select"
                value={pitcherHand}
                onChange={(e) => setPitcherHand(e.target.value)}
              >
                <option value="RHP">RHP</option>
                <option value="LHP">LHP</option>
              </select>
            </div>

            <div className="field-group">
              <label className="field-label">Batter</label>
              {loadingBatters ? (
                <p className="status-line">Loading players…</p>
              ) : (
                <select
                  className="field-select"
                  value={selectedBatter}
                  onChange={(e) => setSelectedBatter(e.target.value)}
                >
                  {sortedBatterIds.map((id) => (
                    <option key={id} value={id}>
                      {batters[id].label}
                    </option>
                  ))}
                </select>
              )}
              {playerCount > 0 && (
                <p className="status-line success">
                  {playerCount} players with data
                </p>
              )}
            </div>

            <button
              className="btn-generate"
              onClick={handleGenerate}
              disabled={loading || !selectedBatter}
            >
              {loading ? "Generating…" : "Generate Positions"}
            </button>

            {error && <p className="status-line error">{error}</p>}
          </div>

          <div className="main">
            {loading ? (
              <div>
                <div className="spinner" />
                <p className="empty-state">Optimizing outfield positions…</p>
              </div>
            ) : imageBase64 ? (
              <div>
                <img
                  className="spray-image"
                  src={`data:image/png;base64,${imageBase64}`}
                  alt="Spray chart"
                />
              </div>
            ) : (
              <p className="empty-state">
                Select a batter and click Generate Positions
              </p>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
